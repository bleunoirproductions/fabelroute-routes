<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar maeve</title>
<style>
  :root {

    --ink: #16181d;
    --quiet: #6a7078;
    --ground: #f6f5f2;
    --card: #fffffe;
    --edge: #e2e0da;
  }
  @media (prefers-color-scheme: dark) {
    :root {

      --quiet: #9aa1ab;
      --ground: #16181d;
      --card: #1e2128;
      --edge: #2c303a;
    }
  }
  body {
    margin: 0;
    padding: 6vh 1.25rem;
    background: var(--ground);
    color: var(--ink);

    display: flex;
    justify-content: center;
  }
  main {
    background: var(--card);

  .facts { color: var(--quiet); margin: 0 0 1.75rem; font-size: 0.95rem; }

    display: inline-block;
    margin-top: 1.5rem;
    word-break: break-all;
    color: inherit;
  }

<main>
  <h1>Bar maeve</h1>
